name: SukiSU-SUSFS-5.4.302-Clang19

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: AOSP-for-vili/android_kernel_xiaomi_sm8350
          ref: lineage-23.2-ksu
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git bc bison flex libssl-dev \
            make libelf-dev python3 \
            zip curl wget cpio

      - name: Setup Clang 19 toolchain
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          LLVM_BIN=/usr/lib/llvm-19/bin
          mkdir -p clang/bin
          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            if [ -x "$LLVM_BIN/$tool" ]; then
              ln -sf "$LLVM_BIN/$tool" clang/bin/$tool
            fi
          done
          clang/bin/clang --version

      - name: Setup GCC toolchain
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            gcc64
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            gcc32

      - name: Add KernelSU (estándar)
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s main
          echo "KernelSU añadido"

      - name: Add Xiaomi missing symbols stubs
        run: |
          cat > drivers/soc/qcom/xiaomi_stubs.c << 'STUBS'
          #include <linux/kernel.h>
          #include <linux/errno.h>

          int get_hw_version_platform(void) { return 0; }
          int get_hw_country_version(void) { return 0; }
          int get_hw_version_build(void) { return 0; }
          int get_hw_version_major(void) { return 0; }
          int get_hw_version_minor(void) { return 0; }

          int mi_disp_register_client(void *data) { return 0; }
          int mi_disp_unregister_client(void *data) { return 0; }

          int get_hw_id_value(void) { return 0; }
          STUBS

          mkdir -p drivers/soc/qcom
          if ! grep -q "xiaomi_stubs.o" drivers/soc/qcom/Makefile; then
            echo 'obj-y += xiaomi_stubs.o' >> drivers/soc/qcom/Makefile
          fi
          echo "✅ Stubs añadidos"

      - name: Configure kernel — réplica del 5.4.268 funcional
        run: |
          cp arch/arm64/configs/vendor/lahaina-qgki_defconfig arch/arm64/configs/star_ksu_defconfig

          cat >> arch/arm64/configs/star_ksu_defconfig << 'EOF'

          # Línea de comandos (igual que kernel funcional)
          CONFIG_CMDLINE="cgroup_disable=pressure"
          CONFIG_CMDLINE_EXTEND=y

          # Seguridad — mismas opciones que el 5.4.268
          CONFIG_STACKPROTECTOR=y
          CONFIG_STACKPROTECTOR_PER_TASK=y
          CONFIG_STACKPROTECTOR_STRONG=y
          CONFIG_SHADOW_CALL_STACK=y

          # LTO y CFI DESACTIVADOS (como en el kernel que arranca)
          # CONFIG_LTO_CLANG is not set
          CONFIG_LTO_NONE=y
          # CONFIG_CFI_CLANG is not set

          # PSTORE para depuración
          CONFIG_PSTORE=y
          CONFIG_PSTORE_RAM=y
          CONFIG_PSTORE_CONSOLE=y
          CONFIG_PSTORE_PMSG=y

          # KernelSU
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_SU=y
          CONFIG_KPM=y

          # SuSFS (con opciones AUTO_ADD_* que usa tu kernel)
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y

          # Formato de imagen
          CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y
          CONFIG_BUILD_ARM64_DT_OVERLAY=y
          # CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE is not set
          EOF

          if [ -f "arch/arm64/configs/vendor/star_QGKI.config" ]; then
            cat arch/arm64/configs/vendor/star_QGKI.config >> arch/arm64/configs/star_ksu_defconfig
          fi

          echo "✅ Defconfig configurado"

      - name: Build kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          make O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            star_ksu_defconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            2>&1 | tee build.log

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          else
            echo "❌ No Image found"
            ls out/arch/arm64/boot/ || true
            exit 1
          fi

          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi

          sed -i 's|do.devicecheck=1|do.devicecheck=0|g' AnyKernel3/anykernel.sh
          grep -q "^BLOCK=" AnyKernel3/anykernel.sh && \
            sed -i 's|^BLOCK=.*|BLOCK=boot;|g' AnyKernel3/anykernel.sh || \
            echo 'BLOCK=boot;' >> AnyKernel3/anykernel.sh
          grep -q "IS_SLOT_DEVICE=" AnyKernel3/anykernel.sh && \
            sed -i 's|IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=1;|g' AnyKernel3/anykernel.sh || \
            echo 'IS_SLOT_DEVICE=1;' >> AnyKernel3/anykernel.sh
          grep -q "device.name1=" AnyKernel3/anykernel.sh && \
            sed -i 's|device.name1=.*|device.name1=star|g' AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 ../SukiSU-5.4.302-Clang19-$(date +%Y%m%d-%H%M).zip . \
            -x ".git*" -x "*.md"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Clang19
          path: SukiSU-5.4.302-Clang19-*.zip
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-clang19
          path: build.log
