name: SukiSU Ultra + SuSFS + KPM - Mi 11 Ultra (star)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git bc bison flex libssl-dev \
            make libelf-dev python3 \
            zip curl wget cpio \
            clang-12 lld-12 llvm-12

      - name: Setup Clang 12 toolchain
        run: |
          mkdir -p clang/bin
          for tool in clang clang++ ld.lld llvm-ar llvm-nm \
                      llvm-objcopy llvm-objdump llvm-strip; do
            ln -sf /usr/bin/${tool}-12 clang/bin/${tool}
          done
          clang/bin/clang --version

      - name: Setup GCC toolchain
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            gcc64
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            gcc32

      - name: Add KernelSU (estándar)
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s main
          echo "KernelSU añadido"

      - name: Add SuSFS completo (kernel-5.4) + stubs + includes + macro
        run: |
          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b kernel-5.4 \
            ../susfs4ksu

          SUSFS_DIR="../susfs4ksu/kernel_patches"

          # Copiar archivos base de SuSFS
          cp "$SUSFS_DIR/fs/susfs.c" fs/susfs.c
          cp "$SUSFS_DIR/include/linux/susfs.h" include/linux/susfs.h
          cp "$SUSFS_DIR/include/linux/susfs_def.h" include/linux/susfs_def.h

          # Añadir header faltante en susfs_def.h
          if ! grep -q "linux/cred.h" include/linux/susfs_def.h; then
            sed -i '1i#include <linux/cred.h>' include/linux/susfs_def.h
          fi

          # Añadir includes necesarios en susfs.h
          if ! grep -q "linux/version.h" include/linux/susfs.h; then
            sed -i '1i#include <linux/version.h>' include/linux/susfs.h
          fi

          # Registrar susfs.o en fs/Makefile
          if ! grep -q "susfs.o" fs/Makefile; then
            sed -i '/obj-y.*+=/a obj-\$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          fi

          # Aplicar parches kernel y fs (los que existen)
          for patch in \
            "$SUSFS_DIR/50_add_susfs_in_kernel-5.4.patch" \
            "$SUSFS_DIR/50_add_susfs_in_fs-5.4.patch"; do
            if [ -f "$patch" ]; then
              patch -p1 --forward --batch < "$patch" || true
              echo "✅ Patch aplicado: $(basename $patch)"
            fi
          done

          # Añadir stubs manuales para funciones que los parches no incluyen
          cat >> include/linux/susfs.h << 'STUBS'

          /* Funciones adicionales para compatibilidad con 5.4 QGKI */
          #ifdef CONFIG_KSU_SUSFS
          extern bool susfs_is_current_proc_umounted(void);
          extern bool susfs_starts_with(const char *str, const char *prefix);
          #endif
          STUBS

          # Definir DEFAULT_KSU_MNT_ID si no existe
          if ! grep -q "DEFAULT_KSU_MNT_ID" include/linux/susfs.h; then
            cat >> include/linux/susfs.h << 'MACRO'

          #ifndef DEFAULT_KSU_MNT_ID
          #define DEFAULT_KSU_MNT_ID 1000
          #endif
          MACRO
          fi

          # Añadir implementación de las funciones faltantes en susfs.c
          cat >> fs/susfs.c << 'IMPL'

          bool susfs_is_current_proc_umounted(void)
          {
              return false;
          }

          bool susfs_starts_with(const char *str, const char *prefix)
          {
              if (!str || !prefix)
                  return false;
              return strncmp(str, prefix, strlen(prefix)) == 0;
          }
          IMPL

          # ⚠️ FORZAR INCLUSIÓN DEL HEADER EN LOS ARCHIVOS MODIFICADOS
          for file in fs/devpts/inode.c kernel/kallsyms.c fs/notify/fdinfo.c; do
            if [ -f "$file" ] && ! grep -q '<linux/susfs.h>' "$file"; then
              sed -i '1i#include <linux/susfs.h>' "$file"
              echo "  ✅ Añadido #include <linux/susfs.h> en $file"
            fi
          done

          # Fix fsnotify para QGKI (misma firma que kernel 5.10+)
          if [ -f "fs/susfs.c" ]; then
            sed -i 's/\.handle_inode_event =/\.handle_event =/g' fs/susfs.c
            sed -i 's/susfs_handle_sdcard_inode_event(struct fsnotify_mark \*mark, u32 mask, struct inode \*inode, struct inode \*dir, const struct qstr \*file_name, u32 cookie)/susfs_handle_sdcard_inode_event(struct fsnotify_group *group, struct inode *inode, u32 mask, const void *data, int data_type, const struct qstr *file_name, u32 cookie, struct fsnotify_iter_info *iter_info)/g' fs/susfs.c
          fi

          echo "✅ SuSFS añadido con todas las correcciones"

      - name: Apply minimal 5.4 fixes
        run: |
          echo "=== FIX 1: pgtable.h ==="
          grep -rl "linux/pgtable.h" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' "$f"
            echo "  FIXED $f"
          done

          echo "=== FIX 2: strncpy_from_user_nofault ==="
          grep -rl "strncpy_from_user_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|strncpy_from_user_nofault|strncpy_from_user|g' "$f"
            echo "  FIXED $f"
          done

          echo "=== FIX 3: TWA_RESUME ==="
          grep -rl "TWA_RESUME" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|TWA_RESUME|0|g' "$f"
            echo "  FIXED $f"
          done

          echo "=== FIX 4: copy_*_nofault ==="
          grep -rl "copy_to_kernel_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|copy_to_kernel_nofault|probe_kernel_write|g' "$f"
          done
          grep -rl "copy_from_user_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|copy_from_user_nofault|probe_kernel_read|g' "$f"
          done
          grep -rl "copy_to_user_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|copy_to_user_nofault|probe_kernel_write|g' "$f"
          done

          echo "=== FIX 5: security_inode_init_security_anon ==="
          grep -rl "security_inode_init_security_anon" drivers/kernelsu/ 2>/dev/null | while read f; do
            perl -0pi -e 's/security_inode_init_security_anon\([^;]*\)/0/g' "$f"
            echo "  FIXED $f"
          done

          echo "=== FIX 6: pkg_observer.c fsnotify ==="
          python3 - << 'PYEOF'
          import re, os
          pkg = "drivers/kernelsu/manager/pkg_observer.c"
          if not os.path.exists(pkg):
              exit(0)
          with open(pkg, "r") as f:
              content = f.read()
          content = content.replace('.handle_inode_event =', '.handle_event =')
          old_fn = re.compile(
              r'static int (ksu_handle_inode_event|ksu_handle_event)\s*\('
              r'\s*struct fsnotify_mark\s*\*\s*\w+\s*,'
              r'\s*u32\s*\w+\s*,'
              r'\s*struct inode\s*\*\s*\w+\s*,'
              r'\s*struct inode\s*\*\s*\w+\s*,'
              r'\s*const struct qstr\s*\*\s*\w+\s*,'
              r'\s*u32\s*\w+\s*\)',
              re.DOTALL
          )
          new_fn = (
              'static int ksu_handle_event('
              'struct fsnotify_group *group, struct inode *inode, '
              'u32 mask, const void *data, int data_type, '
              'const struct qstr *file_name, u32 cookie, '
              'struct fsnotify_iter_info *iter_info)'
          )
          if old_fn.search(content):
              content = old_fn.sub(new_fn, content)
          else:
              content = re.sub(
                  r'static int ksu_handle_inode_event\b',
                  'static int ksu_handle_event', content
              )
          content = content.replace('ksu_handle_inode_event', 'ksu_handle_event')
          with open(pkg, "w") as f:
              f.write(content)
          print("  FIXED pkg_observer.c")
          PYEOF

          echo "=== FIX 7: linux/minmax.h ==="
          python3 - << 'PYEOF'
          import os
          minmax_h = "include/linux/minmax.h"
          if not os.path.exists(minmax_h):
              with open(minmax_h, "w") as f:
                  f.write(
                      "#ifndef _LINUX_MINMAX_H\n"
                      "#define _LINUX_MINMAX_H\n\n"
                      "#include <linux/kernel.h>\n\n"
                      "#endif\n"
                  )
              print("  CREATED include/linux/minmax.h")
          PYEOF

          echo "=== ALL FIXES DONE ==="

      - name: Configure kernel
        run: |
          DEFCONFIG=$(find arch/arm64/configs -name "*lahaina*defconfig" -o -name "*star*defconfig" | head -1)

          if [ -z "$DEFCONFIG" ]; then
            echo "Configs disponibles:"
            find arch/arm64/configs -name "*.defconfig" | head -20
            exit 1
          fi

          echo "Usando: $DEFCONFIG"
          cp "$DEFCONFIG" arch/arm64/configs/star_ksu_defconfig

          cat >> arch/arm64/configs/star_ksu_defconfig << 'EOF'

          # Seguridad
          CONFIG_STACKPROTECTOR=y
          CONFIG_STACKPROTECTOR_STRONG=y
          CONFIG_CFI_CLANG_SHADOW=y

          # KernelSU
          CONFIG_KSU=y
          CONFIG_KPM=y

          # SuSFS
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y

          # Imagen sin comprimir (como Xinran)
          CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y
          # CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE is not set
          EOF

          # Aplicar fragmento star si existe
          if [ -f "arch/arm64/configs/vendor/star_QGKI.config" ]; then
            cat arch/arm64/configs/vendor/star_QGKI.config >> arch/arm64/configs/star_ksu_defconfig
          fi

      - name: Build kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          make O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            star_ksu_defconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            2>&1 | tee build.log

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          else
            echo "❌ No Image found"
            ls out/arch/arm64/boot/ || true
            exit 1
          fi

          sed -i 's|do.devicecheck=1|do.devicecheck=0|g' AnyKernel3/anykernel.sh
          grep -q "^BLOCK=" AnyKernel3/anykernel.sh && \
            sed -i 's|^BLOCK=.*|BLOCK=boot;|g' AnyKernel3/anykernel.sh || \
            echo 'BLOCK=boot;' >> AnyKernel3/anykernel.sh
          grep -q "IS_SLOT_DEVICE=" AnyKernel3/anykernel.sh && \
            sed -i 's|IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=1;|g' AnyKernel3/anykernel.sh || \
            echo 'IS_SLOT_DEVICE=1;' >> AnyKernel3/anykernel.sh
          grep -q "device.name1=" AnyKernel3/anykernel.sh && \
            sed -i 's|device.name1=.*|device.name1=star|g' AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 ../SukiSU-star-$(date +%Y%m%d-%H%M).zip . \
            -x ".git*" -x "*.md"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-star
          path: SukiSU-star-*.zip
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
